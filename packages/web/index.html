<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<!-- viewport-fit=cover so the installed app can paint under the notch and
		     home indicator; the UI pads itself with env(safe-area-inset-*). -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
		/>
		<title>GeoFights — Multiplayer AR Battles</title>
		<meta
			name="description"
			content="Claim real-world zones, collect AI-generated fighters and boosters, and duel other players in realtime AR battles on the map around you."
		/>

		<!-- PWA -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#0e1722" />
		<meta name="color-scheme" content="dark" />
		<meta name="mobile-web-app-capable" content="yes" />
		<!-- iOS home-screen install: Safari reads its own meta names. -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="GeoFights" />

		<!-- Icons -->
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

		<!-- Link previews -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="GeoFights" />
		<meta property="og:title" content="GeoFights — Multiplayer AR Battles" />
		<meta
			property="og:description"
			content="Claim real-world zones, collect AI-generated fighters and boosters, and duel other players in realtime AR battles on the map around you."
		/>
		<meta property="og:image" content="/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="GeoFights — Multiplayer AR Battles" />
		<meta name="twitter:image" content="/og-image.png" />
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/web/main.tsx"></script>
	</body>
</html>
